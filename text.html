<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cozy Crafters SMP title maker. Type a word and get the server title format, ready to copy and paste." />
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://cozycrafters.net/text.html" />
    <meta name="theme-color" content="#7cc4f5" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <script>
      try {
        if (localStorage.getItem('cc-theme') === 'night') {
          document.documentElement.classList.add('night');
        }
      } catch (error) {}
    </script>
    <title>Title Maker | Cozy Crafters SMP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="night-veil"></div>
      <div class="stars">
        <i class="sf sf1"></i>
        <i class="sf sf2"></i>
      </div>
      <div class="mc-sun"></div>
      <div class="mc-moon"></div>
      <div class="mc-cloud c1"></div>
      <div class="mc-cloud c2"></div>
      <div class="mc-cloud c3"></div>
      <div class="mc-cloud c4"></div>
      <div class="mc-cloud c5"></div>
      <div class="mc-cloud c6"></div>
      <div class="mc-cloud c7"></div>
    </div>

    <div class="page-shell">
      <header class="site-header" aria-label="Site header">
        <a class="brand" href="./index.html" aria-label="Cozy Crafters SMP home">
          <span class="brand-mark">🍄</span>
          <span>Cozy Crafters</span>
        </a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="./index.html">Home</a>
          <a href="./text.html" aria-current="page">Tools</a>
        </nav>
        <button class="mode-toggle" type="button" aria-label="Toggle night mode" aria-pressed="false">
          <span class="icon-moon" aria-hidden="true">🌙</span>
          <span class="icon-sun" aria-hidden="true">☀️</span>
        </button>
      </header>

      <main>
        <section class="section-card tool-card" aria-labelledby="tool-title">
          <p class="eyebrow">Server Tools</p>
          <h1 id="tool-title">Title Maker</h1>
          <p class="lede">Type a word and get the server title format, ready to paste in-game.</p>

          <div class="tool-form">
            <div class="tool-field">
              <label class="mini-label" for="word-input">Your word</label>
              <input class="tool-input" id="word-input" type="text" placeholder="Spawn" autocomplete="off" spellcheck="false" maxlength="64" />
            </div>

            <div class="tool-field">
              <span class="mini-label" id="style-label">Text style</span>
              <div class="seg" role="group" aria-labelledby="style-label">
                <button type="button" class="seg-option active" data-style="normal" aria-pressed="true">Normal</button>
                <button type="button" class="seg-option" data-style="small" aria-pressed="false">ꜱᴍᴀʟʟ ᴄᴀᴘꜱ</button>
              </div>
            </div>

            <div class="tool-field">
              <span class="mini-label">In-game preview</span>
              <div class="chat-preview" id="chat-preview" aria-live="polite">━━━━━ Spawn ━━━━━</div>
            </div>

            <div class="tool-field">
              <span class="mini-label">Copy this</span>
              <output class="tool-output" id="tool-output" for="word-input">&amp;m━━━━━&amp;r Spawn&amp;r &amp;m━━━━━&amp;r</output>
            </div>

            <div class="actions tool-actions">
              <button class="button button-primary" type="button" id="copy-button">Copy Title</button>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p>Cozy Crafters SMP · Java Edition · play.cozycrafters.net</p>
      </footer>
    </div>

    <script>
      (() => {
        /* ----- Night mode toggle (shared with the homepage) ----- */
        const rootEl = document.documentElement;
        const modeToggle = document.querySelector('.mode-toggle');
        const themeMeta = document.querySelector('meta[name="theme-color"]');

        const syncTheme = () => {
          const night = rootEl.classList.contains('night');
          if (themeMeta) themeMeta.content = night ? '#142c52' : '#7cc4f5';
          if (modeToggle) modeToggle.setAttribute('aria-pressed', String(night));
        };

        if (modeToggle) {
          modeToggle.addEventListener('click', () => {
            rootEl.classList.toggle('night');
            try {
              localStorage.setItem('cc-theme', rootEl.classList.contains('night') ? 'night' : 'day');
            } catch (error) {}
            syncTheme();
          });
        }

        syncTheme();

        /* ----- Title maker ----- */
        const SMALL_CAPS = {
          a: 'ᴀ', b: 'ʙ', c: 'ᴄ', d: 'ᴅ', e: 'ᴇ', f: 'ꜰ', g: 'ɢ', h: 'ʜ',
          i: 'ɪ', j: 'ᴊ', k: 'ᴋ', l: 'ʟ', m: 'ᴍ', n: 'ɴ', o: 'ᴏ', p: 'ᴘ',
          q: 'ǫ', r: 'ʀ', s: 'ꜱ', t: 'ᴛ', u: 'ᴜ', v: 'ᴠ', w: 'ᴡ', x: 'x',
          y: 'ʏ', z: 'ᴢ'
        };

        const wordInput = document.getElementById('word-input');
        const chatPreview = document.getElementById('chat-preview');
        const toolOutput = document.getElementById('tool-output');
        const copyButton = document.getElementById('copy-button');
        const segOptions = document.querySelectorAll('.seg-option');

        let textStyle = 'normal';

        const toSmallCaps = (text) =>
          text.toLowerCase().replace(/[a-z]/g, (ch) => SMALL_CAPS[ch] || ch);

        const styledWord = () => {
          const raw = wordInput.value.trim() || 'Spawn';
          return textStyle === 'small' ? toSmallCaps(raw) : raw;
        };

        const render = () => {
          const word = styledWord();
          chatPreview.textContent = '━━━━━ ' + word + ' ━━━━━';
          toolOutput.textContent = '&m━━━━━&r ' + word + '&r &m━━━━━&r';
        };

        segOptions.forEach((option) => {
          option.addEventListener('click', () => {
            textStyle = option.dataset.style;
            segOptions.forEach((o) => {
              const active = o === option;
              o.classList.toggle('active', active);
              o.setAttribute('aria-pressed', String(active));
            });
            render();
          });
        });

        wordInput.addEventListener('input', render);

        const copyText = async (text) => {
          if (navigator.clipboard && window.isSecureContext) {
            try {
              await navigator.clipboard.writeText(text);
              return;
            } catch (error) {
              /* fall through to the textarea fallback */
            }
          }

          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          textarea.remove();
        };

        const originalCopyLabel = copyButton.textContent;
        copyButton.addEventListener('click', async () => {
          try {
            await copyText(toolOutput.textContent);
            copyButton.textContent = 'Copied!';
          } catch (error) {
            copyButton.textContent = 'Copy failed';
          }
          window.setTimeout(() => {
            copyButton.textContent = originalCopyLabel;
          }, 1600);
        });

        render();
      })();
    </script>
  </body>
</html>
