          <div class="avatar-workbench">

      <footer class="site-footer">

    </div>

    <script>
      (() => {
        /* ----- Night mode toggle (shared with the homepage) ----- */
        const rootEl = document.documentElement;
        const modeToggle = document.querySelector('.mode-toggle');
        const themeMeta = document.querySelector('meta[name="theme-color"]');

        const syncTheme = () => {
          const night = rootEl.classList.contains('night');
          if (themeMeta) themeMeta.content = night ? '#142c52' : '#7cc4f5';
          if (modeToggle) modeToggle.setAttribute('aria-pressed', String(night));
        };

        if (modeToggle) {
          modeToggle.addEventListener('click', () => {
            rootEl.classList.toggle('night');
            try {
              localStorage.setItem('cc-theme', rootEl.classList.contains('night') ? 'night' : 'day');
            } catch (error) {}
            syncTheme();
          });
        }

        syncTheme();

        /* ================= Avatar maker ================= */

        /* ----- skin loading ----- */
        const skinCache = {};

        const loadSkin = async (user) => {
          if (skinCache[user]) return skinCache[user];
          const response = await fetch(`https://minotar.net/skin/${user}`);
          if (!response.ok) throw new Error('skin fetch failed');
          const bitmap = await createImageBitmap(await response.blob());
          const canvas = document.createElement('canvas');
          canvas.width = 64;
          canvas.height = 64;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(bitmap, 0, 0);
          const legacy = bitmap.height === 32;
          let slim = false;
          try {
            slim = !legacy && ctx.getImageData(54, 20, 1, 1).data[3] === 0;
          } catch (error) {}
          const skin = { ctx: canvas, legacy, slim };
          skinCache[user] = skin;
          return skin;
        };

        const makeCanvas = (w, h) => {
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = false;
          return [canvas, ctx];
        };

        /* left-limb source regions (legacy skins reuse the right limb) */
        const leftArm = (skin) => (skin.legacy ? [44, 20] : [36, 52]);
        const leftLeg = (skin) => (skin.legacy ? [4, 20] : [20, 52]);

        const drawHead = (ctx, skin, dx, dy, ov) => {
          ctx.drawImage(skin.ctx, 8, 8, 8, 8, dx, dy, 8, 8);
          if (ov) ctx.drawImage(skin.ctx, 40, 8, 8, 8, dx, dy, 8, 8);
        };

        const addOutline = (ctx, canvas) => {
          const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const src = new Uint8ClampedArray(img.data);
          const w = canvas.width;
          const h = canvas.height;
          const solid = (px, py) =>
            px >= 0 && py >= 0 && px < w && py < h && src[(py * w + px) * 4 + 3] > 127;
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const i = (y * w + x) * 4;
              if (src[i + 3] <= 127 && (solid(x + 1, y) || solid(x - 1, y) || solid(x, y + 1) || solid(x, y - 1))) {
                img.data[i] = 0;
                img.data[i + 1] = 0;
                img.data[i + 2] = 0;
                img.data[i + 3] = 255;
              }
            }
          }
          ctx.putImageData(img, 0, 0);
        };

        /* PFP: close-cropped 20x20 portrait (MinecraftPFP style) */
        const composePFP = (skin, ov) => {
          const [canvas, ctx] = makeCanvas(20, 20);
          const s = skin.ctx;
          ctx.drawImage(s, 8, 9, 7, 7, 8, 4, 7, 7);        // face front (cropped)
          ctx.drawImage(s, 5, 9, 3, 7, 5, 4, 3, 7);        // head right side
          if (skin.legacy) {
            ctx.drawImage(s, 44, 20, 3, 7, 12, 13, 3, 7);  // right shoulder
          } else {
            ctx.drawImage(s, 36, 52, 3, 7, 12, 13, 3, 7);  // right shoulder (left arm)
          }
          ctx.drawImage(s, 21, 20, 6, 1, 7, 11, 6, 1);     // chest neck line
          ctx.drawImage(s, 20, 21, 8, 8, 6, 12, 8, 8);     // chest
          ctx.drawImage(s, 44, 20, 3, 7, 5, 13, 3, 7);     // left shoulder (right arm)
          if (ov) {
            ctx.drawImage(s, 40, 9, 7, 7, 8, 4, 7, 7);     // hat front
            ctx.drawImage(s, 33, 9, 3, 7, 5, 4, 3, 7);     // hat side
            if (!skin.legacy) {
              ctx.drawImage(s, 52, 52, 3, 7, 12, 13, 3, 7); // right sleeve overlay
              ctx.drawImage(s, 52, 36, 3, 7, 5, 13, 3, 7);  // left sleeve overlay
              ctx.drawImage(s, 20, 37, 8, 8, 6, 12, 8, 8);  // jacket
              ctx.drawImage(s, 21, 36, 6, 1, 7, 11, 6, 1);  // jacket neck line
            }
          }
          return canvas;
        };

        /* Mini: big head, tiny body, black outline */
        const composeMini = (skin, ov) => {
          const [canvas, ctx] = makeCanvas(14, 17);
          const aw = skin.slim ? 3 : 4;
          const [lax, lay] = leftArm(skin);
          const [llx, lly] = leftLeg(skin);
          ctx.drawImage(skin.ctx, 20, 20, 8, 12, 5, 9, 4, 4);        // torso
          ctx.drawImage(skin.ctx, 44, 20, aw, 12, 4, 9, 1, 3);       // right arm
          ctx.drawImage(skin.ctx, lax, lay, aw, 12, 9, 9, 1, 3);     // left arm
          ctx.drawImage(skin.ctx, 4, 20, 4, 12, 5, 13, 2, 3);        // right leg
          ctx.drawImage(skin.ctx, llx, lly, 4, 12, 7, 13, 2, 3);     // left leg
          drawHead(ctx, skin, 3, 1, ov);
          addOutline(ctx, canvas);
          return canvas;
        };

        /* Drops Style: chunky 2.5D figure painted chunk-by-chunk on a 28x32 grid. */
        const composeDrops = (skin, ov) => {
          const GW = 28;
          const GH = 32;
          const sd = skin.ctx.getContext('2d').getImageData(0, 0, 64, 64).data;
          const legacy = skin.legacy;

          const px = (x, y) => {
            const i = (y * 64 + x) * 4;
            return [sd[i], sd[i + 1], sd[i + 2], sd[i + 3]];
          };
          const shadePx = (c, f) => [Math.round(c[0] * f), Math.round(c[1] * f), Math.round(c[2] * f), c[3]];

          const [canvas, ctx] = makeCanvas(GW, GH);
          const out = ctx.createImageData(GW, GH);
          const setChunk = (cx, cy, c) => {
            if (cx < 0 || cx >= GW || cy < 0 || cy >= GH) return;
            const i = (cy * GW + cx) * 4;
            out.data[i] = c[0];
            out.data[i + 1] = c[1];
            out.data[i + 2] = c[2];
            out.data[i + 3] = c[3];
          };
          const getChunk = (cx, cy) => {
            const i = (cy * GW + cx) * 4;
            return [out.data[i], out.data[i + 1], out.data[i + 2], out.data[i + 3]];
          };

          const fillBase = (c0, r0, c1, r1, sx0, sy0, sx1, sy1, factor = 1, flipX = false) => {
            const dw = c1 - c0;
            const dh = r1 - r0;
            const sw = sx1 - sx0;
            const sh = sy1 - sy0;
            for (let dy = 0; dy < dh; dy++) {
              for (let dx = 0; dx < dw; dx++) {
                const srcDx = flipX ? dw - 1 - dx : dx;
                const sx = sx0 + Math.floor((srcDx * sw) / dw);
                const sy = sy0 + Math.floor((dy * sh) / dh);
                let p = px(sx, sy);
                if (factor !== 1) p = shadePx(p, factor);
                setChunk(c0 + dx, r0 + dy, p);
              }
            }
          };

          const copyOverlay = (c0, r0, c1, r1, sx0, sy0, sx1, sy1, factor = 1, flipX = false) => {
            const dw = c1 - c0;
            const dh = r1 - r0;
            const sw = sx1 - sx0;
            const sh = sy1 - sy0;
            for (let dy = 0; dy < dh; dy++) {
              for (let dx = 0; dx < dw; dx++) {
                const srcDx = flipX ? dw - 1 - dx : dx;
                const sx = sx0 + Math.floor((srcDx * sw) / dw);
                const sy = sy0 + Math.floor((dy * sh) / dh);
                const p = px(sx, sy);
                if (p[3] === 0) continue;
                setChunk(c0 + dx, r0 + dy, factor !== 1 ? shadePx(p, factor) : p);
              }
            }
          };

          const fillFaceSquish = (c0, r0, r1, sx0, sy0, overlayMode) => {
            const colWidths = [2, 2, 2, 1, 1, 2, 2, 2];
            const dh = r1 - r0;
            let dx = 0;
            for (let sxOff = 0; sxOff < 8; sxOff++) {
              const w = colWidths[sxOff];
              for (let dy = 0; dy < dh; dy++) {
                const sy = sy0 + Math.floor((dy * 8) / dh);
                const p = px(sx0 + sxOff, sy);
                if (overlayMode && p[3] === 0) continue;
                for (let i = 0; i < w; i++) setChunk(c0 + dx + i, r0 + dy, p);
              }
              dx += w;
            }
          };

          const shadeOutline = (c0, r0, c1, r1, factor = 0.7) => {
            for (let x = c0; x < c1; x++) {
              setChunk(x, r0, shadePx(getChunk(x, r0), factor));
              setChunk(x, r1 - 1, shadePx(getChunk(x, r1 - 1), factor));
            }
            for (let y = r0 + 1; y < r1 - 1; y++) {
              setChunk(c0, y, shadePx(getChunk(c0, y), factor));
              setChunk(c1 - 1, y, shadePx(getChunk(c1 - 1, y), factor));
            }
          };

          fillFaceSquish(2, 5, 21, 8, 8, false);
          fillBase(16, 5, 24, 21, 16, 8, 24, 16, 0.78);
          fillBase(6, 21, 17, 25, 20, 20, 28, 32);
          fillBase(3, 21, 6, 25, 44, 20, 48, 31);
          fillBase(3, 25, 6, 26, 44, 31, 48, 32);
          if (legacy) {
            fillBase(17, 21, 24, 25, 44, 20, 48, 31, 1, true);
            fillBase(17, 25, 24, 26, 44, 31, 48, 32, 1, true);
          } else {
            fillBase(17, 21, 24, 25, 36, 52, 40, 63);
            fillBase(17, 25, 24, 26, 36, 63, 40, 64);
          }
          for (let cy = 21; cy < 26; cy++) {
            for (let cx = 21; cx < 24; cx++) {
              setChunk(cx, cy, shadePx(getChunk(cx, cy), 0.88));
            }
          }
          fillBase(6, 25, 12, 27, 4, 20, 8, 31);
          fillBase(6, 27, 12, 28, 4, 31, 8, 32);
          if (legacy) {
            fillBase(12, 25, 17, 27, 4, 20, 8, 31, 1, true);
            fillBase(12, 27, 17, 28, 4, 31, 8, 32, 1, true);
          } else {
            fillBase(12, 25, 17, 27, 20, 52, 24, 63);
            fillBase(12, 27, 17, 28, 20, 63, 24, 64);
          }
          fillBase(17, 26, 19, 27, 4, 20, 8, 31, 0.82);
          fillBase(17, 27, 19, 28, 4, 31, 8, 32, 0.82);

          shadeOutline(2, 5, 16, 21);
          shadeOutline(16, 5, 24, 21);
          shadeOutline(3, 21, 6, 26);
          shadeOutline(17, 21, 24, 26);
          shadeOutline(6, 25, 12, 28);
          shadeOutline(12, 25, 17, 28);

          if (ov) {
            fillFaceSquish(2, 5, 21, 40, 8, true);
            copyOverlay(17, 5, 25, 21, 48, 8, 56, 16, 0.78);
            copyOverlay(6, 21, 17, 25, 20, 36, 28, 48);
            copyOverlay(3, 21, 6, 25, 44, 36, 48, 47);
            copyOverlay(3, 25, 6, 26, 44, 47, 48, 48);
            if (legacy) {
              copyOverlay(17, 21, 24, 25, 44, 36, 48, 47, 1, true);
              copyOverlay(17, 25, 24, 26, 44, 47, 48, 48, 1, true);
            } else {
              copyOverlay(17, 21, 24, 25, 52, 52, 56, 63);
              copyOverlay(17, 25, 24, 26, 52, 63, 56, 64);
            }
            copyOverlay(6, 25, 12, 27, 4, 36, 8, 47);
            copyOverlay(6, 27, 12, 28, 4, 47, 8, 48);
            if (legacy) {
              copyOverlay(12, 25, 17, 27, 4, 36, 8, 47, 1, true);
              copyOverlay(12, 27, 17, 28, 4, 47, 8, 48, 1, true);
            } else {
              copyOverlay(12, 25, 17, 27, 4, 52, 8, 63);
              copyOverlay(12, 27, 17, 28, 4, 63, 8, 64);
            }
          }

          ctx.putImageData(out, 0, 0);
          return canvas;
        };

        /* ----- styles ----- */
        const STYLES = [
          { key: 'face', label: 'Face', kind: 'url', url: (u, s, ov) => `https://minotar.net/${ov ? 'helm' : 'avatar'}/${u}/${s}` },
          { key: 'head-3d', label: '3D Head', kind: 'url', url: (u, s) => `https://mc-heads.net/head/${u}/${s}` },
          { key: 'cube', label: 'Cube Head', kind: 'url', url: (u, s) => `https://minotar.net/cube/${u}/${s}` },
          { key: 'bust', label: 'Bust', kind: 'url', url: (u, s) => `https://minotar.net/bust/${u}/${s}` },
          { key: 'pfp', label: 'PFP', kind: 'canvas', compose: composePFP },
          { key: 'mini', label: 'Mini', kind: 'canvas', compose: composeMini },
          { key: 'drops', label: 'Drops', kind: 'canvas', compose: composeDrops },
          { key: 'body-flat', label: 'Flat Body', kind: 'url', url: (u, s) => `https://minotar.net/body/${u}/${s}` },
          { key: 'body-3d', label: '3D Body', kind: 'url', url: (u, s) => `https://mc-heads.net/body/${u}/${s}` }
        ];

        /* ----- state ----- */
        const state = {
          style: 'face',
          overlay: true,
          bg: 'transparent',
          bgColor: '#34aeeb',
          fig: 0.8,
          border: 0,
          borderColor: '#1f3a54',
          shape: 'square',
          flip: false
        };

        const nameInput = document.getElementById('name-input');
        const cleanName = () => {
          const raw = nameInput.value.trim().replace(/[^A-Za-z0-9_]/g, '');
          return raw || 'Cheddah01';
        };

        /* ----- base render acquisition ----- */
        const bitmapCache = new Map();

        const fetchBitmap = async (url) => {
          if (bitmapCache.has(url)) return bitmapCache.get(url);
          const response = await fetch(url);
          if (!response.ok) throw new Error('render fetch failed');
          const bitmap = await createImageBitmap(await response.blob());
          bitmapCache.set(url, bitmap);
          return bitmap;
        };

        const getBase = async (styleKey, user, size) => {
          const style = STYLES.find((s) => s.key === styleKey);
          if (style.kind === 'url') {
            const tier = size <= 256 ? 256 : size <= 512 ? 512 : 1024;
            return fetchBitmap(style.url(user, tier, state.overlay));
          }
          const skin = await loadSkin(user);
          return style.compose(skin, state.overlay);
        };

        /* ----- colour + shape helpers ----- */
        const shadeHex = (hex, f) => {
          const n = parseInt(hex.slice(1), 16);
          const ch = (v) => Math.max(0, Math.min(255, Math.round(v * f)));
          return `rgb(${ch(n >> 16)}, ${ch((n >> 8) & 255)}, ${ch(n & 255)})`;
        };

        const shapePath = (ctx, size, inset, shape) => {
          const x = inset;
          const w = size - inset * 2;
          ctx.beginPath();
          if (shape === 'circle') {
            ctx.arc(size / 2, size / 2, w / 2, 0, Math.PI * 2);
          } else if (shape === 'rounded') {
            const r = w * 0.15;
            ctx.moveTo(x + r, x);
            ctx.lineTo(x + w - r, x);
            ctx.quadraticCurveTo(x + w, x, x + w, x + r);
            ctx.lineTo(x + w, x + w - r);
            ctx.quadraticCurveTo(x + w, x + w, x + w - r, x + w);
            ctx.lineTo(x + r, x + w);
            ctx.quadraticCurveTo(x, x + w, x, x + w - r);
            ctx.lineTo(x, x + r);
            ctx.quadraticCurveTo(x, x, x + r, x);
            ctx.closePath();
          } else {
            ctx.rect(x, x, w, w);
          }
        };

        const drawBackground = (ctx, size) => {
          const color = state.bgColor;
          if (state.bg === 'solid') {
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, size, size);
          } else if (state.bg === 'radial') {
            const g = ctx.createRadialGradient(size / 2, size / 2, size * 0.1, size / 2, size / 2, size * 0.75);
            g.addColorStop(0, color);
            g.addColorStop(1, shadeHex(color, 0.55));
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, size, size);
          } else if (state.bg === 'sunburst') {
            const dark = shadeHex(color, 0.78);
            const cx = size / 2;
            const cy = size / 2;
            const rays = 16;
            for (let i = 0; i < rays; i++) {
              const a0 = (i * Math.PI * 2) / rays;
              const a1 = ((i + 1) * Math.PI * 2) / rays;
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.arc(cx, cy, size, a0, a1);
              ctx.closePath();
              ctx.fillStyle = i % 2 ? dark : color;
              ctx.fill();
            }
          } else if (state.bg === 'vignette') {
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, size, size);
            const g = ctx.createRadialGradient(size / 2, size / 2, size * 0.35, size / 2, size / 2, size * 0.72);
            g.addColorStop(0, 'rgba(0, 0, 0, 0)');
            g.addColorStop(1, 'rgba(0, 0, 0, 0.45)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, size, size);
          }
        };

        /* ----- final composition ----- */
        const composeFinal = async (size) => {
          const base = await getBase(state.style, cleanName(), size);
          const [canvas, ctx] = makeCanvas(size, size);

          ctx.save();
          if (state.shape !== 'square') {
            shapePath(ctx, size, 0, state.shape);
            ctx.clip();
          }
          drawBackground(ctx, size);

          const inner = size - state.border * 2;
          const target = inner * state.fig;
          const bw = base.width;
          const bh = base.height;
          const scale = target / Math.max(bw, bh);
          const dw = bw * scale;
          const dh = bh * scale;

          ctx.save();
          if (state.flip) {
            ctx.translate(size, 0);
            ctx.scale(-1, 1);
          }
          ctx.drawImage(base, (size - dw) / 2, (size - dh) / 2, dw, dh);
          ctx.restore();
          ctx.restore();

          if (state.border > 0) {
            shapePath(ctx, size, state.border / 2, state.shape);
            ctx.lineWidth = state.border;
            ctx.strokeStyle = state.borderColor;
            ctx.stroke();
          }

          return canvas;
        };

        /* ----- preview ----- */
        const previewCanvas = document.getElementById('preview-canvas');
        const previewCtx = previewCanvas.getContext('2d');
        previewCtx.imageSmoothingEnabled = false;

        let previewToken = 0;
        const renderPreview = async () => {
          const token = ++previewToken;
          try {
            const composed = await composeFinal(320);
            if (token !== previewToken) return; // superseded by a newer render
            previewCtx.clearRect(0, 0, 320, 320);
            previewCtx.drawImage(composed, 0, 0);
          } catch (error) {
            /* leave the previous preview in place */
          }
        };

        /* ----- style picker ----- */
        const picker = document.getElementById('style-picker');
        const thumbs = STYLES.map((style) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'style-thumb' + (style.key === state.style ? ' active' : '');
          button.setAttribute('role', 'option');
          button.setAttribute('aria-selected', String(style.key === state.style));
          const canvas = document.createElement('canvas');
          canvas.width = 96;
          canvas.height = 96;
          const label = document.createElement('span');
          label.textContent = style.label;
          button.append(canvas, label);
          button.addEventListener('click', () => {
            state.style = style.key;
            thumbs.forEach((t) => {
              const active = t.style.key === style.key;
              t.button.classList.toggle('active', active);
              t.button.setAttribute('aria-selected', String(active));
            });
            renderPreview();
          });
          picker.appendChild(button);
          return { style, button, canvas };
        });

        const renderThumbs = () => {
          const user = cleanName();
          thumbs.forEach(async ({ style, canvas }) => {
            try {
              const base = await getBase(style.key, user, 96);
              const ctx = canvas.getContext('2d');
              ctx.imageSmoothingEnabled = false;
              ctx.clearRect(0, 0, 96, 96);
              const scale = (96 * 0.92) / Math.max(base.width, base.height);
              const dw = base.width * scale;
              const dh = base.height * scale;
              ctx.drawImage(base, (96 - dw) / 2, (96 - dh) / 2, dw, dh);
            } catch (error) {
              /* leave stale thumb */
            }
          });
        };

        /* ----- downloads ----- */
        const flashLabel = (button, message) => {
          const original = button.dataset.label;
          button.textContent = message;
          window.setTimeout(() => {
            button.textContent = original;
          }, 1600);
        };

        const saveBlob = (blob, filename) => {
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = filename;
          link.click();
          URL.revokeObjectURL(link.href);
        };

        document.querySelectorAll('[data-dl]').forEach((button) => {
          button.addEventListener('click', async () => {
            const size = Number(button.dataset.dl);
            try {
              const composed = await composeFinal(size);
              composed.toBlob((blob) => {
                if (!blob) return flashLabel(button, 'Failed');
                saveBlob(blob, `${cleanName()}-${state.style}-${size}.png`);
                flashLabel(button, 'Saved!');
              }, 'image/png');
            } catch (error) {
              flashLabel(button, 'Failed');
            }
          });
        });

        document.getElementById('skin-dl').addEventListener('click', async (event) => {
          const button = event.currentTarget;
          const user = cleanName();
          try {
            const response = await fetch(`https://minotar.net/skin/${user}`);
            if (!response.ok) throw new Error('skin fetch failed');
            saveBlob(await response.blob(), `${user}-skin.png`);
            flashLabel(button, 'Saved!');
          } catch (error) {
            flashLabel(button, 'Failed');
          }
        });

        /* ----- control wiring ----- */
        let debounceTimer = null;
        nameInput.addEventListener('input', () => {
          window.clearTimeout(debounceTimer);
          debounceTimer = window.setTimeout(() => {
            renderThumbs();
            renderPreview();
          }, 450);
        });

        const bgColorInput = document.getElementById('opt-bg-color');
        const borderColorInput = document.getElementById('opt-border-color');

        document.getElementById('opt-overlay').addEventListener('change', (e) => {
          state.overlay = e.target.checked;
          renderThumbs();
          renderPreview();
        });

        document.getElementById('opt-bg').addEventListener('change', (e) => {
          state.bg = e.target.value;
          bgColorInput.disabled = state.bg === 'transparent';
          renderPreview();
        });

        bgColorInput.addEventListener('input', (e) => {
          state.bgColor = e.target.value;
          renderPreview();
        });

        document.getElementById('opt-fig').addEventListener('input', (e) => {
          state.fig = Number(e.target.value) / 100;
          document.getElementById('fig-val').textContent = e.target.value + '%';
          renderPreview();
        });

        document.getElementById('opt-border').addEventListener('input', (e) => {
          state.border = Number(e.target.value);
          document.getElementById('border-val').textContent = e.target.value + 'px';
          borderColorInput.disabled = state.border === 0;
          renderPreview();
        });

        borderColorInput.addEventListener('input', (e) => {
          state.borderColor = e.target.value;
          renderPreview();
        });

        document.getElementById('opt-shape').addEventListener('change', (e) => {
          state.shape = e.target.value;
          renderPreview();
        });

        document.getElementById('opt-flip').addEventListener('change', (e) => {
          state.flip = e.target.checked;
          renderPreview();
        });

        /* ----- init ----- */
        renderThumbs();
        renderPreview();
      })();
    </script>
  </body>
</html>
